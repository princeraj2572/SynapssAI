# Dev overrides — use with: docker compose -f docker-compose.yml -f docker-compose.dev.yml up
version: '3.9'

services:
  api:
    environment:
      - DEBUG=1
    command: uvicorn main:app --host 0.0.0.0 --port 8080 --reload --log-level debug

  frontend:
    environment:
      - NODE_ENV=development
