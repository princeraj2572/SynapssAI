version: "3.9"

services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: lifeOS-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: synapse
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: 7970
    ports:
      - "5432:5432"
    volumes:
      - ./data/postgres:/var/lib/postgresql/data
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql

  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: lifeOS-api
    restart: unless-stopped
    env_file: .env
    ports:
      - "8080:8080"
    depends_on:
      - postgres
      - mistral
    volumes:
      - ./backend:/app

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: lifeOS-frontend
    restart: unless-stopped
    ports:
      - "3000:3000"
    depends_on:
      - api

  mistral:
    image: vllm/vllm:latest
    container_name: lifeOS-mistral
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - VLLM_API_KEY=sk-lifeOS-key
    volumes:
      - ./data/models:/root/.cache/huggingface
    command: --model mistralai/Mistral-7B-Instruct-v0.1 --host 0.0.0.0 --port 8000 --max-model-len 4096
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
